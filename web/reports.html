<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — career-ops</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
  <style>
    .report-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-4);
    }

    .report-card {
      background: var(--color-paper);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      transition: border-color var(--dur-fast) var(--ease-out),
                  box-shadow var(--dur-fast) var(--ease-out);
      text-decoration: none;
      color: inherit;
    }

    .report-card:hover {
      border-color: var(--color-border-strong);
      box-shadow: 0 2px 8px oklch(0% 0 0 / 0.06);
    }

    .report-card:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    .report-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .report-company {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--text-base);
      letter-spacing: -0.01em;
      color: var(--color-ink);
      font-style: normal;
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .report-role {
      font-size: var(--text-sm);
      color: var(--color-ink-2);
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .report-meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .report-date {
      font-size: var(--text-xs);
      color: var(--color-ink-3);
      font-family: var(--font-mono);
    }

    .report-card-actions {
      display: flex;
      gap: var(--space-2);
      margin-top: auto;
      padding-top: var(--space-2);
      border-top: 1px solid var(--color-border);
    }

    .report-num {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-ink-3);
    }

    .legitimacy-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px var(--space-2);
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-border);
      color: var(--color-ink-3);
    }

    @media (max-width: 480px) {
      .report-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <nav class="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark" aria-hidden="true">co</div>
        <div>
          <div class="sidebar-brand-name">career-ops</div>
        </div>
      </div>
      <div class="sidebar-nav">
        <a href="index.html"    class="nav-item"><svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>Dashboard</a>
        <a href="evaluate.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 8l2 2 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Evaluate</a>
        <a href="reports.html"  class="nav-item" aria-current="page"><svg class="nav-icon" viewBox="0 0 16 16" fill="none"><path d="M3 2h7l3 3v9H3V2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 2v3h3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 7h6M5 10h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Reports</a>
        <a href="cv.html"       class="nav-item"><svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M5 5h6M5 8h6M5 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>CV &amp; Lebenslauf</a>
        <div class="nav-section-label">Tools</div>
        <a href="setup.html"    class="nav-item"><svg class="nav-icon" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Settings</a>
      </div>
    </nav>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" onclick="openSidebar()" aria-label="Open navigation">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <span class="topbar-title">Reports</span>
        </div>
        <div class="topbar-right">
          <select class="form-input" id="filter-status" style="width:auto;cursor:pointer;font-size:var(--text-xs);padding:var(--space-2) var(--space-3);" onchange="filterReports()">
            <option value="">All statuses</option>
            <option value="Evaluated">Evaluated</option>
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
          </select>
          <select class="form-input" id="filter-score" style="width:auto;cursor:pointer;font-size:var(--text-xs);padding:var(--space-2) var(--space-3);" onchange="filterReports()">
            <option value="">All scores</option>
            <option value="4">4.0+</option>
            <option value="3.5">3.5+</option>
            <option value="3">3.0+</option>
          </select>
        </div>
      </header>

      <div class="page-body">

        <div class="table-toolbar" style="margin-bottom:var(--space-6);">
          <div>
            <div class="section-head-title" style="font-size:var(--text-xl);font-family:var(--font-display);font-weight:600;letter-spacing:-0.02em;">Evaluation reports</div>
            <p style="font-size:var(--text-sm);color:var(--color-ink-3);margin-top:var(--space-1);" id="report-count">Loading…</p>
          </div>
          <div style="display:flex;gap:var(--space-2);">
            <input class="form-input" type="search" id="search-input" placeholder="Search company or role…" style="width:220px;font-size:var(--text-sm);" oninput="filterReports()" />
          </div>
        </div>

        <div class="report-grid" id="report-grid">
          <p style="font-size:var(--text-sm);color:var(--color-ink-3);">Loading reports…</p>
        </div>

        <div id="outputs-section" style="margin-top:var(--space-10);">
          <div style="margin-bottom:var(--space-5);">
            <div class="section-head-title" style="font-size:var(--text-xl);font-family:var(--font-display);font-weight:600;letter-spacing:-0.02em;">Generated PDFs</div>
            <p style="font-size:var(--text-sm);color:var(--color-ink-3);margin-top:var(--space-1);">CV exports and Lebenslauf files.</p>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Filename</th><th>Type</th><th>Size</th><th></th></tr>
              </thead>
              <tbody id="outputs-tbody">
                <tr><td colspan="4"><div class="empty-state"><div class="empty-state-title">No PDFs yet</div><div class="empty-state-sub">Generate your CV from the CV page.</div></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    let allReports = [];

    async function loadReports() {
      try {
        const [reportsRes, outputsRes] = await Promise.all([
          fetch('/api/reports'),
          fetch('/api/outputs')
        ]);

        if (reportsRes.ok) {
          allReports = await reportsRes.json();
          renderReports(allReports);
        }

        if (outputsRes.ok) {
          const outputs = await outputsRes.json();
          renderOutputs(outputs);
        }
      } catch (e) { console.error(e); }
    }

    function renderReports(reports) {
      const grid = document.getElementById('report-grid');
      document.getElementById('report-count').textContent = `${reports.length} report${reports.length !== 1 ? 's' : ''}`;

      if (!reports.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;"><div class="empty-state">
          <div class="empty-state-title">No reports yet</div>
          <div class="empty-state-sub">Evaluate a job posting to generate your first report.</div>
          <a href="evaluate.html" class="btn btn-primary btn-sm">Evaluate a role →</a>
        </div></div>`;
        return;
      }

      grid.innerHTML = reports.map(r => {
        const score = parseFloat(r.score);
        const scoreClass = score >= 4 ? 'badge-high' : score >= 3 ? 'badge-mid' : 'badge-low';
        const statusClass = 'badge-' + (r.status || 'evaluated').toLowerCase();
        return `
        <div class="report-card" tabindex="0" role="article">
          <div class="report-card-top">
            <div style="min-width:0;flex:1;">
              <div class="report-company">${esc(r.company || 'Unknown')}</div>
              <div class="report-role">${esc(r.role || '')}</div>
            </div>
            ${r.score ? `<span class="badge ${scoreClass}" style="flex-shrink:0;">${r.score}</span>` : ''}
          </div>
          <div class="report-meta">
            <span class="report-num">#${r.num || '?'}</span>
            <span class="report-date">${r.date || ''}</span>
            ${r.status ? `<span class="badge ${statusClass}">${esc(r.status)}</span>` : ''}
            ${r.legitimacy ? `<span class="legitimacy-badge">${esc(r.legitimacy)}</span>` : ''}
          </div>
          <div class="report-card-actions">
            <a href="/api/report?path=${encodeURIComponent(r.path)}" class="btn btn-secondary btn-sm" target="_blank" style="flex:1;justify-content:center;">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 2h7l3 3v9H3V2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
              View report
            </a>
            ${r.pdf_path ? `<a href="/api/output?path=${encodeURIComponent(r.pdf_path)}" class="btn btn-ghost btn-sm" target="_blank">PDF</a>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    function renderOutputs(outputs) {
      const tbody = document.getElementById('outputs-tbody');
      if (!outputs.length) return;
      tbody.innerHTML = outputs.map(f => {
        const isLebenslauf = f.name.toLowerCase().includes('lebenslauf');
        const isEN = f.name.toLowerCase().includes('-en-') || f.name.toLowerCase().endsWith('-en.pdf');
        const type = isLebenslauf ? (isEN ? 'Lebenslauf (EN)' : 'Lebenslauf (DE)') : 'CV';
        return `<tr>
          <td class="td-mono">${esc(f.name)}</td>
          <td><span class="badge badge-evaluated">${esc(type)}</span></td>
          <td class="td-muted">${f.size || ''}</td>
          <td><a href="/api/output?path=${encodeURIComponent(f.path)}" class="td-link" target="_blank">Download →</a></td>
        </tr>`;
      }).join('');
    }

    function filterReports() {
      const status = document.getElementById('filter-status').value;
      const minScore = parseFloat(document.getElementById('filter-score').value) || 0;
      const query = document.getElementById('search-input').value.toLowerCase();

      const filtered = allReports.filter(r => {
        if (status && r.status !== status) return false;
        if (minScore && parseFloat(r.score) < minScore) return false;
        if (query && !(r.company || '').toLowerCase().includes(query) && !(r.role || '').toLowerCase().includes(query)) return false;
        return true;
      });
      renderReports(filtered);
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function openSidebar()  { document.querySelector('.sidebar').classList.add('is-open'); document.getElementById('sidebar-overlay').classList.add('is-open'); }
    function closeSidebar() { document.querySelector('.sidebar').classList.remove('is-open'); document.getElementById('sidebar-overlay').classList.remove('is-open'); }

    loadReports();
  </script>
</body>
</html>
