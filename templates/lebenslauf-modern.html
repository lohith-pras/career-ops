<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — Lebenslauf</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700; font-style: normal; font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin-ext.woff2') format('woff2');
    font-weight: 300 700; font-style: normal; font-display: swap;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000; font-style: normal; font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin-ext.woff2') format('woff2');
    font-weight: 100 1000; font-style: normal; font-display: swap;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 10.5px; line-height: 1.5; color: #1a1a2e; background: #fff;
  }

  .layout { display: flex; gap: 0; min-height: 100%; }

  /* Sidebar */
  .sidebar {
    width: 33%; background: #0f1535; color: #e8ecf8;
    padding: 26px 18px; }
  .sidebar .photo {
    width: 110px; height: 140px; object-fit: cover;
    border-radius: 6px; margin: 0 auto 18px; display: block;
    border: 2px solid #2a3566; }
  .sidebar h2 {
    font-family: 'Space Grotesk', sans-serif; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: #6f8fff; margin: 18px 0 8px; font-weight: 600; }
  .sidebar .pd-row { margin-bottom: 7px; }
  .sidebar .pd-label {
    display: block; font-size: 8.5px; text-transform: uppercase;
    letter-spacing: 0.6px; color: #8a96c0; }
  .sidebar .pd-value { font-size: 10.5px; color: #f4f6fd; }
  .sidebar a { color: #cdd6f4; text-decoration: none; word-break: break-word; }

  /* Main */
  .main { width: 67%; padding: 26px 28px; }
  .name {
    font-family: 'Space Grotesk', sans-serif; font-size: 26px;
    font-weight: 700; color: #0f1535; line-height: 1.1; }
  .role-line { color: #6f8fff; font-weight: 600; font-size: 12px; margin: 4px 0 16px; }

  .main h2 {
    font-family: 'Space Grotesk', sans-serif; font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.8px; color: #0f1535;
    border-bottom: 2px solid #6f8fff; padding-bottom: 3px;
    margin: 16px 0 8px; }
  .main h3 { font-size: 11.5px; font-weight: 700; color: #1a1a2e; margin-top: 9px; }
  .main p { margin: 4px 0; }
  .main ul { margin: 5px 0 5px 16px; }
  .main li { margin-bottom: 3px; }
  .main a { color: #3a4dc0; text-decoration: none; }
  .main hr { display: none; }
  .main strong { color: #0f1535; }

  .signature { margin-top: 26px; padding-top: 8px; color: #444; font-size: 10px; }
  .signature .sig-line { border-top: 1px solid #999; width: 200px; margin-top: 32px; padding-top: 3px; }
</style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      {{PHOTO_BLOCK}}
      <h2>Kontakt</h2>
      {{CONTACT_BLOCK}}
      <h2>Persönliche Daten</h2>
      {{PERSONAL_DATA}}
    </aside>
    <section class="main">
      <div class="name">{{NAME}}</div>
      <div class="role-line">{{ROLE_LINE}}</div>
      {{BODY}}
      <div class="signature">
        {{SIGNATURE}}
        <div class="sig-line">Unterschrift</div>
      </div>
    </section>
  </div>
</body>
</html>
